name: siakad_app
description: "Aplikasi SIAKAD Kampus modern (Flutter) - terhubung ke SIAKAD UPI YPTK Scraper API."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  printing: ^5.15.0
  pdf: ^3.11.1
  flutter_widget_from_html: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
