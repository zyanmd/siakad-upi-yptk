name: siakad_app
description: "Aplikasi SIAKAD Kampus modern (Flutter) - terhubung ke SIAKAD UPI YPTK Scraper API."
publish_to: "none"
version: 1.0.9+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  printing: ^5.15.0
  pdf: ^3.11.1
  image_picker: ^1.2.3
  google_fonts: ^8.2.1
  timeline_tile: ^2.0.0
  package_info_plus: ^8.1.2
  onesignal_flutter: ^5.2.8
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1   # ← tambahkan ini

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false                    # ← ubah jadi false
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png   # opsional, kalau mau dipakai di dalam app juga
    - assets/images/open_peeps_mahasiswa.png
